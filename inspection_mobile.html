<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>出荷検品スマホ版</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 12px;
    background: #f5f5f5;
    color: #222;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 12px;
  }
  .box {
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input[type="file"] {
    width: 100%;
    font-size: 15px;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font-size: 24px;
    padding: 12px;
    border: 2px solid #ccc;
    border-radius: 8px;
  }
  button {
    width: 100%;
    font-size: 18px;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: #fff;
    margin-top: 8px;
  }
  button.secondary {
    background: #666;
  }
  button.danger {
    background: #b00020;
  }
  .status {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    background: #eee;
  }
  .ok {
    background: #d9f7d9 !important;
    color: #076807;
  }
  .ng {
    background: #ffd6d6 !important;
    color: #b00020;
  }
  .warn {
    background: #fff0c2 !important;
    color: #7a4b00;
  }
  .small {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 6px;
    vertical-align: top;
  }
  th {
    background: #eee;
  }
  .row-ok {
    background: #e8f8e8;
  }
  .row-ng {
    background: #ffe8e8;
  }
</style>
</head>
<body>

<h1>出荷検品</h1>

<div class="box">
  <label>① 検品用CSVを読み込み</label>

  <label style="display:block; padding:14px; background:#007bff; color:#fff; text-align:center; border-radius:8px; font-size:18px;">
    CSVを選択
    <input type="file" id="dataFile" accept=".csv,text/csv" style="display:none;">
  </label>

  <div class="small">
    必要列：送り状No / 注文番号 / JAN / 品番 / 商品名 / 数量<br>
    ※数量が無い場合は1として扱います。
  </div>
</div>

<div class="box">
  <label>② 送り状Noをスキャン</label>
  <input type="text" id="invoiceInput" placeholder="送り状No" inputmode="numeric" autocomplete="off" disabled>
</div>

<div class="box">
  <label>③ 商品JANをスキャン</label>
  <input type="text" id="janInput" placeholder="商品JAN" inputmode="numeric" autocomplete="off" disabled>
</div>

<div class="box">
  <div id="message" class="status">検品用CSVを読み込んでください</div>
  <div id="detail" class="small"></div>
</div>

<div class="box">
  <button id="downloadBtn" class="secondary" disabled>検品結果CSVを保存</button>
  <button id="resetBtn" class="danger">画面をリセット</button>
</div>

<div class="box">
  <label>現在の注文の商品</label>
  <table>
    <thead>
      <tr>
        <th>JAN</th>
        <th>品番</th>
        <th>商品名</th>
        <th>必要</th>
        <th>読取</th>
      </tr>
    </thead>
    <tbody id="currentBody"></tbody>
  </table>
</div>

<div class="box">
  <label>検品履歴</label>
  <table>
    <thead>
      <tr>
        <th>時刻</th>
        <th>送り状No</th>
        <th>商品JAN</th>
        <th>結果</th>
      </tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<script>
let dataRows = [];
let invoiceMap = new Map(); // invoice -> order
let orderItems = new Map(); // order -> Map(jan -> item)
let currentInvoice = "";
let currentOrder = "";
let historyRows = [];

const $ = (id) => document.getElementById(id);

function normalize(v) {
  let s = String(v ?? "")
    .replace(/^\uFEFF/, "")
    .replace(/^'/, "")
    .trim()
    .replace(/\s/g, "");

  if (s.startsWith('="') && s.endsWith('"')) {
    s = s.slice(2, -1);
  }

  // ★追加：英字を除去（数字だけにする）
  s = s.replace(/[^0-9]/g, "");

  return s;
}

function csvEscape(v) {
  const s = String(v ?? "");
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const n = text[i + 1];

    if (c === '"' && inQuotes && n === '"') {
      cell += '"';
      i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(cell);
      cell = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (cell !== "" || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
      if (c === "\r" && n === "\n") i++;
    } else {
      cell += c;
    }
  }

  if (cell !== "" || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function findHeader(header, names) {
  const clean = header.map(h => normalize(h).toLowerCase());
  for (const name of names) {
    const idx = clean.indexOf(normalize(name).toLowerCase());
    if (idx >= 0) return idx;
  }
  return -1;
}

function showMessage(text, type = "") {
  const el = $("message");
  el.textContent = text;
  el.className = "status " + type;
}

function addHistory(invoice, jan, result, memo, order = "", itemCode = "", itemName = "") {
  const now = new Date();
  const time = now.toLocaleString("ja-JP");
  const row = { time, invoice, jan, result, memo, order, itemCode, itemName };
  historyRows.push(row);

  const tr = document.createElement("tr");
  tr.className = result === "OK" ? "row-ok" : "row-ng";
  tr.innerHTML = `
    <td>${time}</td>
    <td>${invoice}</td>
    <td>${jan}</td>
    <td>${result}<br><span class="small">${memo || ""}</span></td>
  `;
  $("historyBody").prepend(tr);
  $("downloadBtn").disabled = false;
}

function renderCurrentItems() {
  const tbody = $("currentBody");
  tbody.innerHTML = "";

  if (!currentOrder || !orderItems.has(currentOrder)) return;

  const items = orderItems.get(currentOrder);
  for (const item of items.values()) {
    const tr = document.createElement("tr");
    if (item.scanned >= item.need) tr.className = "row-ok";
    tr.innerHTML = `
      <td>${item.jan}</td>
      <td>${item.code || ""}</td>
      <td>${item.name || ""}</td>
      <td>${item.need}</td>
      <td>${item.scanned}</td>
    `;
    tbody.appendChild(tr);
  }
}

function loadData(rows) {
  invoiceMap.clear();
  orderItems.clear();
  dataRows = [];

  if (!rows.length) throw new Error("CSVが空です。");

  const header = rows[0];
  const idxInvoice = findHeader(header, ["送り状No", "送り状番号", "ShipInvoiceNumber1", "Invoice"]);
  const idxOrder = findHeader(header, ["注文番号", "OrderId", "Order ID"]);
  const idxJan = findHeader(header, ["JAN", "商品JAN", "jan"]);
  const idxQty = findHeader(header, ["数量", "Qty", "Quantity"]);
  const idxCode = findHeader(header, ["品番", "Product Code", "商品コード"]);
  const idxName = findHeader(header, ["商品名", "Description", "商品名"]);

  if (idxInvoice < 0 || idxOrder < 0 || idxJan < 0) {
    throw new Error("列名が不足しています。送り状No・注文番号・JAN が必要です。");
  }

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const invoice = normalize(r[idxInvoice]);
    const order = normalize(r[idxOrder]);
    const jan = normalize(r[idxJan]);
    const qtyRaw = idxQty >= 0 ? normalize(r[idxQty]) : "";
    const qty = Number(qtyRaw) > 0 ? Number(qtyRaw) : 1;
    const code = idxCode >= 0 ? String(r[idxCode] ?? "") : "";
    const name = idxName >= 0 ? String(r[idxName] ?? "") : "";

    if (!invoice || !order || !jan) continue;

    dataRows.push({ invoice, order, jan, qty, code, name });
    invoiceMap.set(invoice, order);

    if (!orderItems.has(order)) orderItems.set(order, new Map());
    const items = orderItems.get(order);

    if (!items.has(jan)) {
      items.set(jan, { jan, code, name, need: 0, scanned: 0 });
    }
    items.get(jan).need += qty;
  }

  if (!dataRows.length) throw new Error("有効なデータ行がありません。");

  showMessage("CSV読込OK。送り状Noをスキャンしてください。", "ok");
  $("detail").textContent = `読込件数：${dataRows.length}行 / 送り状数：${invoiceMap.size}件`;
  $("invoiceInput").disabled = false;
  $("invoiceInput").focus();
}

$("dataFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = parseCSV(reader.result);
      loadData(rows);
    } catch (err) {
      showMessage(err.message, "ng");
      $("detail").textContent = "";
    }
  };
  reader.readAsText(file, "UTF-8");
});

$("invoiceInput").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;

  const invoice = normalize(e.target.value);
  e.target.value = "";

  if (!invoiceMap.has(invoice)) {
    currentInvoice = "";
    currentOrder = "";
    $("janInput").disabled = true;
    renderCurrentItems();
    showMessage("NG：送り状Noが見つかりません", "ng");
    $("detail").textContent = `送り状No：${invoice}`;
    addHistory(invoice, "", "NG", "送り状Noが検品データにありません");
    return;
  }

  currentInvoice = invoice;
  currentOrder = invoiceMap.get(invoice);

  showMessage("送り状OK。商品JANをスキャンしてください。", "ok");
  $("detail").textContent = `送り状No：${currentInvoice} / 注文番号：${currentOrder}`;
  renderCurrentItems();

  $("janInput").disabled = false;
  $("janInput").focus();
});

$("janInput").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;

  const jan = normalize(e.target.value);
  e.target.value = "";

  if (!currentInvoice || !currentOrder) {
    showMessage("先に送り状Noをスキャンしてください。", "warn");
    $("invoiceInput").focus();
    return;
  }

  const items = orderItems.get(currentOrder);
  const item = items ? items.get(jan) : null;

  if (!item) {
    showMessage("NG：この送り状の商品ではありません", "ng");
    $("detail").textContent = `送り状No：${currentInvoice} / 注文番号：${currentOrder} / 読取JAN：${jan}`;
    addHistory(currentInvoice, jan, "NG", "この注文に存在しないJAN", currentOrder);
    return;
  }

  if (item.scanned >= item.need) {
    showMessage("NG：読みすぎです", "ng");
    $("detail").textContent = `JAN：${jan} / 必要数：${item.need} / 読取済：${item.scanned}`;
    addHistory(currentInvoice, jan, "NG", "必要数量を超過", currentOrder, item.code, item.name);
    return;
  }

  item.scanned += 1;
  renderCurrentItems();

  const complete = Array.from(items.values()).every(x => x.scanned >= x.need);
  if (complete) {
    showMessage("OK：この送り状は検品完了", "ok");
    $("detail").textContent = `送り状No：${currentInvoice} / 注文番号：${currentOrder}`;
    addHistory(currentInvoice, jan, "OK", "検品完了", currentOrder, item.code, item.name);

    currentInvoice = "";
    currentOrder = "";
    $("janInput").disabled = true;
    $("invoiceInput").focus();
  } else {
    showMessage("OK：商品一致", "ok");
    $("detail").textContent = `JAN：${jan} / ${item.code || ""} / ${item.name || ""}`;
    addHistory(currentInvoice, jan, "OK", "商品一致", currentOrder, item.code, item.name);
  }
});

$("downloadBtn").addEventListener("click", () => {
  const header = ["日時","送り状No","商品JAN","結果","メモ","注文番号","品番","商品名"];
  const lines = [header.map(csvEscape).join(",")];

  for (const r of historyRows) {
    lines.push([
      r.time, r.invoice, r.jan, r.result, r.memo, r.order, r.itemCode, r.itemName
    ].map(csvEscape).join(","));
  }

  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "inspection_result_" + new Date().toISOString().slice(0,19).replace(/[-T:]/g,"") + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

$("resetBtn").addEventListener("click", () => {
  if (!confirm("画面をリセットしますか？検品履歴も消えます。")) return;
  location.reload();
});
</script>
</body>
</html>
